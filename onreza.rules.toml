schema = "EDGE_RULE_SET_V1"

# Дубль монтажа (без -2) -> основной монтаж
[[rule]]
id = "montazh-dubl"
when.path = { exact = "/uslugi/montazh-2/" }
action.redirect = { target = "/uslugi/montazh/", status_code = 301 }

# Удалённая страница-категория -> главная
[[rule]]
id = "navesy-iz-polikarbonata-parent"
when.path = { exact = "/katalog/navesy/navesy-iz-polikarbonata/" }
action.redirect = { target = "/", status_code = 301 }

# Дочерние товарные страницы -> новый уровень вложенности
[[rule]]
id = "navesy-iz-polikarbonata-children"
when.path = { glob = "/katalog/navesy/navesy-iz-polikarbonata/{rest...}" }
action.redirect = { target = "/katalog/navesy/{rest}", status_code = 301 }

# Удалённый раздел козырьков -> навесы для дачи
[[rule]]
id = "kozyrki-root"
when.path = { exact = "/kozyrki/" }
action.redirect = { target = "/katalog/navesy/navesy-dlya-dachi/", status_code = 301 }

[[rule]]
id = "kozyrki-children"
when.path = { glob = "/katalog/kozyrki/{rest...}" }
action.redirect = { target = "/katalog/navesy/navesy-dlya-dachi/", status_code = 301 }

# Удалённый раздел мангалов -> каталог навесов
[[rule]]
id = "mangaly-root"
when.path = { exact = "/katalog/navesy/navesy-dlya-mangala/" }
action.redirect = { target = "/katalog/navesy/", status_code = 301 }

[[rule]]
id = "mangaly-children"
when.path = { glob = "/katalog/navesy/navesy-dlya-mangala/{rest...}" }
action.redirect = { target = "/katalog/navesy/", status_code = 301 }

# Одиночные страницы мангалов -> смежные разделы
[[rule]]
id = "mangaly-single-polikarbonat"
when.path = { exact = "/katalog/navesy/navesy-iz-polikarbonata-dlya-mangala/" }
action.redirect = { target = "/katalog/navesy/", status_code = 301 }

[[rule]]
id = "mangaly-single-metal"
when.path = { exact = "/katalog/navesy/metallicheskie-navesy/metallicheskie-navesy-dlya-mangala/" }
action.redirect = { target = "/katalog/navesy/metallicheskie-navesy/", status_code = 301 }

[[rule]]
id = "mangaly-single-metal-dacha"
when.path = { exact = "/katalog/navesy/metallicheskie-navesy/metallicheskie-navesy-dlya-dachi-dlya-mangala/" }
action.redirect = { target = "/katalog/navesy/metallicheskie-navesy/", status_code = 301 }

[[rule]]
id = "mangaly-single-kovanye"
when.path = { exact = "/katalog/navesy/drugie/kovanye-navesy-dlya-mangala/" }
action.redirect = { target = "/katalog/navesy/drugie/", status_code = 301 }

[[rule]]
id = "mangaly-besedka-metal"
when.path = { exact = "/katalog/besedki/besedki-iz-metalla/metallicheskie-besedki-s-mangalom/" }
action.redirect = { target = "/katalog/besedki/besedki-iz-metalla/", status_code = 301 }

[[rule]]
id = "mangaly-besedka-dlya"
when.path = { exact = "/katalog/besedki/besedki-iz-metalla/besedki-dlya-mangala-iz-metalla/" }
action.redirect = { target = "/katalog/besedki/besedki-iz-metalla/", status_code = 301 }

# Удалённая страница "Партнерам" -> главная
[[rule]]
id = "partneram-root"
when.path = { exact = "/partneram/" }
action.redirect = { target = "/", status_code = 301 }

# Legacy Yoast-sitemap -> актуальный Astro-sitemap
[[rule]]
id = "sitemap-legacy"
when.path = { exact = "/sitemap_index.xml" }
action.redirect = { target = "/sitemap-index.xml", status_code = 301 }

# Заявка "Бесплатный замер" -> ONREZA Function (SMS владельцу, без WhatsApp)
[[rule]]
id = "api-send-sms"
when.path = { exact = "/api/send-sms" }
when.methods = ["POST"]
action.pipeline = { override = true, steps = [{ handle = "send-sms" }] }
